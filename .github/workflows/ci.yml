name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

  unit-and-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:unit -- --coverage

      - name: Validate vocabulary content
        run: npm run validate:vocab

  build-budget:
    runs-on: ubuntu-latest
    needs: [lint-typecheck, unit-and-content]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Production build + bundle stats (rollup visualizer when ANALYZE=true)
        run: npm run build:analyze

      - name: Upload bundle stats HTML
        uses: actions/upload-artifact@v4
        with:
          name: bundle-stats
          path: dist/stats.html

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: [lint-typecheck, unit-and-content]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright smoke test
        run: npx playwright test tests/e2e/phase1-happy-path.spec.ts
